{% if person.gallery and person.gallery.albums %}
<button class="profile-gallery-trigger" type="button" data-open-gallery aria-haspopup="dialog" aria-controls="person-gallery" aria-label="Open photo albums for {{ person.name }}" title="Photo albums">
  <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21M3 15l4-4 3 3"/></svg>
  <span class="gallery-trigger-count">{{ person.gallery.total }}</span>
</button>
{% endif %}
