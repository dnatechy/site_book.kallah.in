{% extends "base.html" %}
{% block content %}
<nav class="crumb" aria-label="Breadcrumb">
  <a href="{{ url_for('web.home') }}">Home</a>
  <span aria-hidden="true">/</span>
  <span>Sign in</span>
</nav>
<section class="section login-page-section">
  <div class="login-card">
    <p class="eyebrow">Quick verification</p>
    <h1>Sign in to confirm your booking</h1>
    <p class="muted">Enter your mobile number and choose how you prefer to receive booking updates. You will return to your selected appointment or stay.</p>
    <form id="login-form" class="login-form" data-next-url="{{ next_url }}">
      <label class="login-field-label" for="login-phone">
        Mobile number
        <span class="phone-number-field">
          <span class="phone-country-code" aria-label="India country code +91">+91</span>
          <input id="login-phone" class="input-control login-phone-input" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98765 - 43210" maxlength="13" pattern="[0-9]{5} - [0-9]{5}" aria-describedby="login-phone-help" required>
        </span>
        <small class="phone-number-help" id="login-phone-help">Enter your 10-digit mobile number.</small>
      </label>

      <fieldset class="login-channel-group">
        <legend class="login-field-label">Preferred message option</legend>
        <div class="login-channel-grid">
          <label class="channel-choice-card">
            <input type="radio" name="channel" value="sms" checked>
            <div class="channel-card-body">
              <span class="channel-icon" aria-hidden="true">💬</span>
              <strong>Text message (SMS)</strong>
              <span>Standard SMS alert to your phone</span>
            </div>
          </label>
          <label class="channel-choice-card">
            <input type="radio" name="channel" value="whatsapp">
            <div class="channel-card-body">
              <span class="channel-icon" aria-hidden="true">📱</span>
              <strong>WhatsApp message</strong>
              <span>Instant updates on WhatsApp</span>
            </div>
          </label>
        </div>
      </fieldset>

      <p id="login-status" class="location-status" role="status" aria-live="polite"></p>
      <button type="submit" class="button button-primary booking-submit-btn">Continue to booking →</button>
    </form>
  </div>
</section>
{% endblock %}
