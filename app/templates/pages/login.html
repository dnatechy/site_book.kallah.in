{% extends "base.html" %}
{% block content %}
<nav class="crumb" aria-label="Breadcrumb">
  <a href="{{ url_for('web.home') }}">Home</a>
  <span aria-hidden="true">/</span>
  <span>Sign in</span>
</nav>
<section class="section login-page-section">
  <div class="login-card">
    <p class="eyebrow">Quick verification</p>
    <h1>Sign in to book your slot</h1>
    <p class="muted">Enter your mobile number and choose how you prefer to receive appointment updates. You will return straight to your selected slot.</p>
    <form id="login-form" class="login-form" data-next-url="{{ next_url }}">
      <label class="login-field-label" for="login-phone">
        Mobile number
        <input id="login-phone" class="input-control login-phone-input" type="tel" inputmode="numeric" placeholder="Enter 10-digit mobile number" maxlength="15" required>
      </label>

      <fieldset class="login-channel-group">
        <legend class="login-field-label">Preferred message option</legend>
        <div class="login-channel-grid">
          <label class="channel-choice-card">
            <input type="radio" name="channel" value="sms" checked>
            <div class="channel-card-body">
              <span class="channel-icon" aria-hidden="true">💬</span>
              <strong>Text message (SMS)</strong>
              <span>Standard SMS alert to your phone</span>
            </div>
          </label>
          <label class="channel-choice-card">
            <input type="radio" name="channel" value="whatsapp">
            <div class="channel-card-body">
              <span class="channel-icon" aria-hidden="true">📱</span>
              <strong>WhatsApp message</strong>
              <span>Instant updates on WhatsApp</span>
            </div>
          </label>
        </div>
      </fieldset>

      <p id="login-status" class="location-status" role="status" aria-live="polite"></p>
      <button type="submit" class="button button-primary booking-submit-btn">Continue to appointment →</button>
    </form>
  </div>
</section>
{% endblock %}
