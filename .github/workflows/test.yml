name: Flask and Flutter API contract tests

on:
  push:
    branches: [prePublish, Dev_v01, Publish]
  pull_request:
    branches: [prePublish, Publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Validate browser JavaScript syntax
        run: for file in app/static/js/*.js; do node --check "$file"; done
      - name: Run Flask and API tests
        run: python -m pytest -q
